<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An ongoing movie log: upcoming films, my watchlist, and notes on what I've seen.">
    <meta name="author" content="Sourabh Betigeri">
    <title>Movie Notes — Sourabh Betigeri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
    <header>
        <div class="header-content">
            <p class="post-back"><a href="index.html#blog"><i class="fas fa-arrow-left"></i>&nbsp;Back to blog</a></p>
            <h1>Movie Notes</h1>
            <p class="subtitle">An ongoing log &mdash; films I'm anticipating, my watchlist,
            and notes on what I've seen.</p>
        </div>
    </header>

    <main>
        <section>
            <p>A living list I update as I go. Edit <code>movies.json</code> to add films under
            <em>Upcoming</em>, <em>Watchlist</em>, or <em>Watched</em>.</p>

            <h3 class="resume-section-title"><i class="fas fa-hourglass-half"></i>&nbsp;Upcoming</h3>
            <div id="movies-upcoming" class="movie-list"></div>

            <h3 class="resume-section-title"><i class="fas fa-list"></i>&nbsp;Watchlist</h3>
            <div id="movies-watchlist" class="movie-list"></div>

            <h3 class="resume-section-title"><i class="fas fa-check"></i>&nbsp;Watched</h3>
            <div id="movies-watched" class="movie-list"></div>

            <p class="post-back"><a href="index.html#blog"><i class="fas fa-arrow-left"></i>&nbsp;Back to blog</a></p>
        </section>
    </main>

    <footer>
        <p>Last updated: June 2026</p>
    </footer>

    <script>
      function renderMovies(containerId, items, showRating) {
        const container = document.getElementById(containerId);
        if (!container) return;
        if (!items || !items.length) {
          container.innerHTML = '<p class="movie-empty">Nothing here yet.</p>';
          return;
        }
        items.forEach(function (m) {
          const item = document.createElement('article');
          item.className = 'movie-item';

          const head = document.createElement('div');
          head.className = 'movie-head';

          const title = document.createElement('span');
          title.className = 'movie-title';
          title.textContent = m.title || 'Untitled';
          head.appendChild(title);

          if (m.year) {
            const year = document.createElement('span');
            year.className = 'movie-year';
            year.textContent = '(' + m.year + ')';
            head.appendChild(year);
          }

          if (showRating && m.rating) {
            const rating = document.createElement('span');
            rating.className = 'movie-rating';
            rating.textContent = m.rating;
            head.appendChild(rating);
          }

          item.appendChild(head);

          if (m.note) {
            const note = document.createElement('p');
            note.className = 'movie-note';
            note.textContent = m.note;
            item.appendChild(note);
          }

          container.appendChild(item);
        });
      }

      fetch('movies.json')
        .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function (data) {
          renderMovies('movies-upcoming', data.upcoming, false);
          renderMovies('movies-watchlist', data.watchlist, false);
          renderMovies('movies-watched', data.watched, true);
        })
        .catch(function () {
          document.getElementById('movies-upcoming').innerHTML =
            '<p class="movie-empty">Could not load movies.json.</p>';
        });
    </script>
</body>
</html>
